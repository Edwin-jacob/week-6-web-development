<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>SpendWise</h1>
            <p>Track your spending and stay within your budget.</p>
        </header>

        <section class="budget-section">
            <h2>Set Your Budget</h2>

            <form id="budgetForm">
                <input
                    type="number"
                    id="budgetInput"
                    placeholder="Enter your budget"
                    min="0"
                    step="0.01"
                    required
                >
                <button type="submit">Set Budget</button>
            </form>
        </section>

        <section class="dashboard">
            <div class="card">
                <h3>Budget</h3>
                <p id="budgetDisplay">KES 0.00</p>
            </div>

            <div class="card">
                <h3>Total Spent</h3>
                <p id="spentDisplay">KES 0.00</p>
            </div>

            <div class="card">
                <h3>Remaining</h3>
                <p id="remainingDisplay">KES 0.00</p>
            </div>
        </section>

        <section class="feedback">
            <p id="feedbackMessage">Set a budget to get started.</p>
        </section>

        <section class="expense-section">
            <h2>Add an Expense</h2>

            <form id="expenseForm">
                <input
                    type="text"
                    id="expenseName"
                    placeholder="Expense name"
                    required
                >

                <input
                    type="number"
                    id="expenseAmount"
                    placeholder="Amount"
                    min="0.01"
                    step="0.01"
                    required
                >

                <select id="expenseCategory" required>
                    <option value="">Select category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Bills">Bills</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section class="expenses">
            <h2>Expense History</h2>

            <ul id="expenseList">
                <li>No expenses added yet.</li>
            </ul>
        </section>

        <button id="clearButton" class="clear-button">
            Clear All Expenses
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
